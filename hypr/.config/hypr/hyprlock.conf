# hyprlock config
# Docs: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

# Unlock with password (PAM) and fingerprint (fprintd) in parallel
auth {
    pam:enabled = true
    pam:module = hyprlock

    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint or type password
    fingerprint:present_message = Scanning fingerprint
    fingerprint:retry_delay = 250
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

label {
    monitor =
    text = $TIME
    color = rgba(221, 221, 221, 1.0)
    font_size = 90
    font_family = Sans Bold
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 90
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(151, 151, 151, 0.8)
    inner_color = rgba(30, 30, 30, 0.9)
    font_color = rgb(221, 221, 221)
    fade_on_empty = true
    placeholder_text = <i>Fingerprint or password...</i>
    hide_input = false
    rounding = -1
    check_color = rgba(204, 136, 34, 1.0)
    fail_color = rgba(204, 34, 34, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -40
    halign = center
    valign = center
}
