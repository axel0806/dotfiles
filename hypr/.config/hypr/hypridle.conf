# hypridle config
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # Lock the session via hyprlock (does nothing if it is already running)
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before suspend, which covers closing the lid
    before_sleep_cmd = loginctl lock-session
    # Turn the display back on after resume
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock after 5 minutes (300 seconds) of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
